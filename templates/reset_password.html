<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a new password | Pirate Market</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/entry.css') }}">
</head>
<body class="pm pm-entry">
<main class="pm-entry__panel">
    <a href="{{ url_for('index') }}"><img class="pm-entry__crest pm-entry__crest--small" src="{{ url_for('static', filename='images/logo-96.png') }}" alt="Pirate Market home" width="96" height="96"></a>
    <form class="pm-entry__form" action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
        <h1>Choose a new password</h1>
        {% if error %}<p class="pm-notice pm-notice--error pm-entry__message" role="alert">{{ error }}</p>{% endif %}
        <div class="pm-field">
            <label class="pm-label" for="password">New password</label>
            <input class="pm-input" id="password" type="password" name="password" autocomplete="new-password"
                   minlength="8" required autofocus aria-describedby="passwordHint">
            <p class="pm-hint" id="passwordHint">At least 8 characters.</p>
        </div>
        <div class="pm-field">
            <label class="pm-label" for="confirm_password">Confirm new password</label>
            <input class="pm-input" id="confirm_password" type="password" name="confirm_password" autocomplete="new-password"
                   minlength="8" required>
        </div>
        <button type="submit" class="pm-btn pm-btn--primary">Save new password</button>
    </form>
    <p class="pm-entry__links"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
</main>
</body>
</html>
