{% from 'partials/storefront_form.html' import storefront_fields, facade_preview %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create storefront | Pirate Market</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/create_storefront.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/seller.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/my_storefront.css') }}">
</head>
<body class="pm">
{% include 'partials/site_nav.html' %}

<main class="pm-page">
    <h1 class="pm-page-title">Create storefront</h1>
    <div class="pm-editor">
        <form class="pm-editor__form" id="storefrontForm" enctype="multipart/form-data" novalidate>
            {{ storefront_fields() }}
            <p class="pm-error pm-form-error" id="formError" role="alert"></p>
            <div class="pm-form-actions">
                <button type="button" class="pm-btn pm-btn--ghost" id="cancelBtn">Cancel</button>
                <button type="submit" class="pm-btn pm-btn--primary">Create storefront</button>
            </div>
        </form>
        {{ facade_preview() }}
    </div>
</main>

{% include 'partials/site_footer.html' %}
<script src="{{ url_for('static', filename='js/nav_pane.js') }}"></script>
<script src="{{ url_for('static', filename='js/listing_card.js') }}"></script>
<script src="{{ url_for('static', filename='js/image_uploader.js') }}"></script>
<script src="{{ url_for('static', filename='js/seller_form.js') }}"></script>
<script src="{{ url_for('static', filename='js/create_storefront.js') }}"></script>
</body>
</html>
