<!-- login.html - Updated by James Williams 10/26/26 - Pirate Market redesign with simpler
     text, labels and errors shown on the form -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Pirate Market</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/entry.css') }}">
</head>
<body class="pm pm-entry">
<main class="pm-entry__panel">
    <a href="{{ url_for('index') }}"><img class="pm-entry__crest pm-entry__crest--small" src="{{ url_for('static', filename='images/logo-96.png') }}" alt="Pirate Market home" width="96" height="96"></a>
    <form class="pm-entry__form" action="{{ url_for('auth.login') }}" method="POST">
        <h1>Log in</h1>
        {% with messages = get_flashed_messages() %}{% for message in messages %}
        <p class="pm-notice pm-entry__message" role="status">{{ message }}</p>
        {% endfor %}{% endwith %}
        {% if error %}<p class="pm-notice pm-notice--error pm-entry__message" role="alert">{{ error }}</p>{% endif %}
        <div class="pm-field">
            <label class="pm-label" for="username">Username</label>
            <input class="pm-input" id="username" type="text" name="username" autocomplete="username" required autofocus value="{{ username or '' }}">
        </div>
        <div class="pm-field">
            <label class="pm-label" for="password">Password</label>
            <input class="pm-input" id="password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="pm-btn pm-btn--primary">Log in</button>
    </form>
    <p class="pm-entry__links">New here? <a href="{{ url_for('auth.signup') }}">Create account</a></p>
    <p class="pm-entry__links"><a href="{{ url_for('auth.admin_login') }}">Admin log in</a></p>
</main>
</body>
</html>
