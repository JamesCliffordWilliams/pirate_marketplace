<!-- admin_login.html - Updated by James Williams 10/26/26 - new Pirate Market look, same form and fields -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin log in | Pirate Market</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/entry.css') }}">
</head>
<body class="pm pm-entry">
<main class="pm-entry__panel">
    <img class="pm-entry__crest pm-entry__crest--small" src="{{ url_for('static', filename='images/logo-96.png') }}" alt="Pirate Market" width="96" height="96">
    <form class="pm-entry__form" action="{{ url_for('auth.admin_login') }}" method="POST">
        <h1>Admin log in</h1>
        {% if error %}<p class="pm-notice pm-notice--error pm-entry__message" role="alert">{{ error }}</p>{% endif %}
        <div class="pm-field">
            <label class="pm-label" for="username">Admin username</label>
            <input class="pm-input" id="username" type="text" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="pm-field">
            <label class="pm-label" for="password">Password</label>
            <input class="pm-input" id="password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="pm-btn pm-btn--primary">Log in</button>
    </form>
    <p class="pm-entry__links"><a href="{{ url_for('auth.login') }}">Shopper log in</a></p>
</main>
</body>
</html>
