<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password | Pirate Market</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/entry.css') }}">
</head>
<body class="pm pm-entry">
<main class="pm-entry__panel">
    <a href="{{ url_for('index') }}"><img class="pm-entry__crest pm-entry__crest--small" src="{{ url_for('static', filename='images/logo-96.png') }}" alt="Pirate Market home" width="96" height="96"></a>
    <form class="pm-entry__form" action="{{ url_for('auth.forgot_password') }}" method="POST">
        <h1>Forgot password</h1>
        {% with messages = get_flashed_messages() %}{% for message in messages %}
        <p class="pm-notice pm-entry__message" role="status">{{ message }}</p>
        {% endfor %}{% endwith %}
        {% if error %}<p class="pm-notice pm-notice--error pm-entry__message" role="alert">{{ error }}</p>{% endif %}
        <div class="pm-field">
            <label class="pm-label" for="email">Hampton University email</label>
            <input class="pm-input" id="email" type="email" name="email" autocomplete="email" required autofocus
                   placeholder="you@my.hamptonu.edu" value="{{ email or '' }}" aria-describedby="emailHint">
            <p class="pm-hint" id="emailHint">We'll email you a link to choose a new password.</p>
        </div>
        <button type="submit" class="pm-btn pm-btn--primary">Send reset link</button>
    </form>
    <p class="pm-entry__links">Remembered it? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</main>
</body>
</html>
