<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order confirmed | Pirate Market</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/checkout.css') }}">
</head>
<body class="pm">
{% include 'partials/site_nav.html' %}

<main class="pm-page pm-confirm" id="confCard" aria-live="polite">
    <p class="pm-muted" id="loadingMsg">Loading your order…</p>
</main>

{% include 'partials/site_footer.html' %}
<script src="{{ url_for('static', filename='js/nav_pane.js') }}"></script>
<script>
(async () => {
    const card = document.getElementById("confCard");
    const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    };
    const link = (label, href, kind) => {
        const a = el("a", `pm-btn pm-btn--${kind}`, label);
        a.href = href;
        return a;
    };
    const money = (value) => `$${parseFloat(value || 0).toFixed(2)}`;
    const sentenceCase = (text) => text ? text.charAt(0) + text.slice(1).toLowerCase().replace(/_/g, " ") : "";

    function renderError(message) {
        const box = el("div", "pm-empty");
        box.append(el("h1", null, "We couldn't show this order"), el("p", null, message),
            link("Browse storefronts", "/storefronts", "primary"));
        card.replaceChildren(box);
    }

    const conf = new URLSearchParams(window.location.search).get("conf");
    if (!conf) {
        renderError("The link is missing its confirmation number. Your orders are in Account.");
        return;
    }

    let order, items;
    try {
        const res = await fetch(`/api/orders/by-confirmation/${encodeURIComponent(conf)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Order not found.");
        order = data.order;
        items = data.order_items || [];
    } catch (error) {
        renderError(`${error.message || "The order didn't load."} Your orders are in Account.`);
        return;
    }

    const number = el("p", "pm-confirm__number", "Confirmation ");
    number.appendChild(el("strong", null, order.confirmation_number));
    const placed = order.created_at
        ? new Date(order.created_at).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })
        : "";

    const summary = el("section", "pm-summary");
    summary.setAttribute("aria-label", "Order summary");
    const list = el("div", "pm-summary__items");
    items.forEach((item) => {
        const row = el("div", "pm-summary__item");
        const info = el("div");
        const size = item.selected_size === "One Size" ? "One size" : (item.selected_size ? `Size ${item.selected_size}` : "");
        info.append(el("span", "pm-summary__name", item.item_name || "Item"),
            el("span", "pm-muted", [size, `Qty ${item.quantity}`].filter(Boolean).join(", ")));
        row.append(info, el("span", "pm-price", money(item.quantity * parseFloat(item.price_at_purchase))));
        list.appendChild(row);
    });
    const total = el("p", "pm-summary__total");
    total.append(el("span", null, "Total"), el("span", "pm-price", money(order.total_amount)));
    summary.append(el("h2", null, "Your order"), list, total);

    const handoff = el("section", "pm-summary");
    handoff.setAttribute("aria-label", "Handoff details");
    const details = el("dl");
    [["Name", `${order.buyer_first_name} ${order.buyer_last_name}`], ["Email", order.buyer_email],
     ["Phone", order.buyer_contact], ["Meet at", order.buyer_meeting_location], ["Placed", placed],
     ["Status", sentenceCase(order.order_status)],
     ["Pick up by", order.order_status === "SUBMITTED" ? order.pickup_by : "—"]].forEach(([label, value]) => {
        if (value) details.append(el("dt", "pm-muted", label), el("dd", null, value));
    });
    handoff.append(el("h2", null, "Handoff"), details);

    const actions = el("div", "pm-confirm__actions");
    actions.append(link("Keep shopping", "/storefronts", "primary"), link("View my orders", "/auth/account", "secondary"));

    card.replaceChildren(el("h1", null, "Order placed"), number,
        el("p", "pm-muted", "The seller will contact you to arrange the handoff. You pay when you meet."),
        summary, handoff, actions);
    document.title = `Order ${order.confirmation_number} | Pirate Market`;
})();
</script>
</body>
</html>
