<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storefronts | Pirate Market</title>
  <link rel="preload" href="{{ url_for('static', filename='fonts/instrument-sans-var.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/storefront.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}">
</head>
<body class="pm">
{% include 'partials/site_nav.html' %}

<main class="pm-page pm-directory" id="storefrontDirectory" data-user-id="{{ session.get('user_id') or '' }}">
  <div class="pm-toolbar">
    <div>
      <h1>Storefronts</h1>
      <p class="pm-muted" id="storefrontCount" aria-live="polite"></p>
    </div>
    <label class="pm-sort">
      <span>Sort</span>
      <select id="storefrontSort" class="pm-select">
        <option value="items">Most items</option>
        <option value="newest">Newest</option>
        <option value="name">Name, A to Z</option>
      </select>
    </label>
  </div>

  <section class="pm-facades" id="storefrontGrid" aria-label="Storefronts" aria-busy="true">
    {% for _ in range(6) %}
    <div class="pm-facade" aria-hidden="true">
      <div class="pm-skeleton" style="aspect-ratio:16/9;border-radius:0"></div>
      <div style="padding:16px"><div class="pm-skeleton pm-skeleton--line"></div><div class="pm-skeleton pm-skeleton--line pm-skeleton--short"></div></div>
    </div>
    {% endfor %}
  </section>

  <nav class="pm-pager" id="storefrontPager" aria-label="Storefront pages" hidden>
    <button type="button" class="pm-btn pm-btn--secondary" id="prevPageBtn">Previous</button>
    <span id="pageIndicator"></span>
    <button type="button" class="pm-btn pm-btn--secondary" id="nextPageBtn">Next</button>
  </nav>

  <section class="pm-section" id="hotRail" aria-labelledby="hotRailHeading" hidden>
    <div class="pm-section-head">
      <h2 id="hotRailHeading">Hot right now</h2>
      <a href="{{ url_for('hot_pages_bp.hot_page') }}">See all</a>
    </div>
    <div class="pm-grid pm-rail" id="hotRailGrid"></div>
  </section>

  <section class="pm-section" aria-labelledby="shopByCategory">
    <div class="pm-section-head"><h2 id="shopByCategory">Shop by category</h2></div>
    <nav class="pm-chips" aria-labelledby="shopByCategory">
      {% for slug, label in nav_categories %}
      <a class="pm-chip" href="{{ url_for('category_pages_bp.category_listings_page', parent_slug=slug) }}">{{ label }}</a>
      {% endfor %}
      <a class="pm-chip" href="{{ url_for('category_pages_bp.categories_page') }}">All categories</a>
    </nav>
  </section>
</main>

{% include 'partials/site_footer.html' %}
<script src="{{ url_for('static', filename='js/nav_pane.js') }}"></script>
<script src="{{ url_for('static', filename='js/listing_card.js') }}"></script>
<script src="{{ url_for('static', filename='js/storefront.js') }}"></script>
</body>
</html>
