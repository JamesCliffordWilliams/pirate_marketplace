<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storefront | Pirate Market</title>
    <link rel="preload" href="{{ url_for('static', filename='fonts/instrument-sans-var.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/storefront_view.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/listing_card.css') }}">
</head>
<body class="pm">
{% include 'partials/site_nav.html' %}

<main class="pm-page pm-store" id="storefrontPage" data-storefront-id="{{ storefront_id }}" data-user-id="{{ session.get('user_id') or '' }}">
    <div class="pm-facade__cover pm-store__cover" id="storeCover" data-count="0"></div>

    <header class="pm-store__head">
        <span class="pm-medallion pm-medallion--lg" id="storeMedallion" aria-hidden="true"></span>
        <div class="pm-store__title">
            <h1 id="pageTitle"><span class="pm-skeleton pm-skeleton--line" style="display:block;width:240px;height:32px"></span></h1>
            <p class="pm-muted" id="storeMeta"></p>
        </div>
        <button type="button" class="pm-btn pm-btn--secondary" id="shareBtn">Share</button>
    </header>

    <div class="pm-store__about">
        <p id="storeDescription"></p>
        <p class="pm-muted" id="contactInfo"></p>
    </div>

    <section class="pm-section" aria-labelledby="listingsHeading">
        <div class="pm-section-head">
            <h2 id="listingsHeading">Products</h2>
            <label class="pm-sort">
                <span>Sort</span>
                <select id="listingSort" class="pm-select">
                    <option value="newest">Newest</option>
                    <option value="price_asc">Price, low to high</option>
                    <option value="price_desc">Price, high to low</option>
                </select>
            </label>
        </div>
        <div class="pm-grid" id="listingGrid" aria-busy="true">
            {% for _ in range(5) %}
            <div aria-hidden="true"><div class="pm-skeleton pm-skeleton--photo"></div><div class="pm-skeleton pm-skeleton--line"></div><div class="pm-skeleton pm-skeleton--line pm-skeleton--short"></div></div>
            {% endfor %}
        </div>
    </section>
</main>

{% include 'partials/site_footer.html' %}
<script src="{{ url_for('static', filename='js/nav_pane.js') }}"></script>
<script src="{{ url_for('static', filename='js/listing_card.js') }}"></script>
<script src="{{ url_for('static', filename='js/storefront_view.js') }}"></script>
</body>
</html>
