<!-- index.html (landing) - Updated by James Williams 10/26/26 - Pirate Market redesign: the crest is the
     hero; Log in and Create account are real links (the 840KB button images are gone) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate Market | The campus marketplace</title>
    <link rel="preload" href="{{ url_for('static', filename='images/logo.png') }}" as="image">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/entry.css') }}">
</head>
<body class="pm pm-entry">
<main class="pm-entry__panel">
    <h1 class="pm-visually-hidden">Pirate Market</h1>
    <img class="pm-entry__crest" src="{{ url_for('static', filename='images/logo.png') }}" alt="Pirate Market" width="512" height="512">
    <p class="pm-entry__tagline">The campus marketplace. Shop student storefronts, or open your own.</p>
    <div class="pm-entry__actions">
        <a class="pm-btn pm-btn--primary" href="{{ url_for('auth.login') }}">Log in</a>
        <a class="pm-btn pm-btn--secondary" href="{{ url_for('auth.signup') }}">Create account</a>
    </div>
</main>
</body>
</html>
