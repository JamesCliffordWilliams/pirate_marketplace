<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | Pirate Market</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/checkout.css') }}">
</head>
<body class="pm">
{% include 'partials/site_nav.html' %}

<main class="pm-page pm-account">
    <div class="pm-toolbar">
        <div>
            <h1>{{ session.get('user', 'Account') }}</h1>
            <p class="pm-muted">Your orders and saved items</p>
        </div>
        <a class="pm-btn pm-btn--secondary" href="{{ url_for('auth.logout') }}">Log out</a>
    </div>

    <div class="pm-tabs" role="tablist" aria-label="Account">
        <button class="pm-tab" role="tab" id="tab-purchases" aria-controls="purchases" aria-selected="true">Purchases</button>
        <button class="pm-tab" role="tab" id="tab-wishlist" aria-controls="wishlist" aria-selected="false" tabindex="-1">Saved</button>
    </div>

    <section id="purchases" role="tabpanel" aria-labelledby="tab-purchases">
        <p id="purchasesEmptyState" class="pm-muted">Loading your orders…</p>
        <div id="purchasesContainer" class="pm-orders"></div>
    </section>

    <section id="wishlist" role="tabpanel" aria-labelledby="tab-wishlist" hidden>
        <p id="wishlistEmptyState" class="pm-muted">Loading your saved items…</p>
        <div id="wishlistItemsContainer" class="pm-grid"></div>
    </section>

    <p class="pm-account__seller pm-muted">Selling something? Manage your listings in
        <a href="{{ url_for('my_storefront') }}">My storefront</a>.</p>
</main>

{% include 'partials/site_footer.html' %}
<script src="{{ url_for('static', filename='js/nav_pane.js') }}"></script>
<script src="{{ url_for('static', filename='js/listing_card.js') }}"></script>
<script src="{{ url_for('static', filename='js/account.js') }}"></script>
</body>
</html>
